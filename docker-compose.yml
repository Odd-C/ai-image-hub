services:
  image-hub:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5190:5190"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - /home/oddc/.libtv:/home/oddc/.libtv:ro
      - /home/oddc/.hermes/skills/creative/lovart-api:/home/oddc/.hermes/skills/creative/lovart-api:ro
