{% extends "base.html" %}
{% block title %}登录 · AI Image Hub{% endblock %}
{% block body %}
<main class="login-shell">
  <section class="login-intro">
    <span class="eyebrow">INTERNAL CREATIVE SYSTEM</span>
    <h1>一个入口，<br>连接所有生图平台。</h1>
    <p>原始提示词直达模型。统一管理 Lovart、LibTV 与图像 API 的任务、结果和历史。</p>
  </section>
  <form class="login-card" method="post" action="/login">
    <div><span class="brand-mark">IH</span><strong>AI Image Hub</strong></div>
    <h2>登录工作台</h2>
    {% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
    <label>账号<input name="username" autocomplete="username" autofocus required></label>
    <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">进入工作台</button>
    <small>仅供公司内部授权用户使用</small>
  </form>
</main>
{% endblock %}
