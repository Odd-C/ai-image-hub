{% extends "base.html" %}
{% block body %}
<div class="top-sensor" aria-hidden="true"></div>
<header class="topbar workspace-topbar" id="workspace-nav">
  <a class="brand" href="/projects"><span class="brand-mark">IH</span><span>AI Image Hub</span></a>
  <nav aria-label="工作区导航"><a href="/projects">项目</a><button class="nav-tab active" data-view="create">创作画布</button><button class="nav-tab" data-view="history">历史</button>{% if user.role == "admin" %}<a href="/admin" data-admin-link>管理</a>{% endif %}</nav>
  <div class="account"><span id="save-state" class="save-state"><i></i>已保存</span><span>{{ user.display_name or user.username }}</span><button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-label="展开导航">菜单</button><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="text-button">退出</button></form></div>
</header>
<main class="workspace-shell" data-project-id="{{ project.id }}">
  <section id="create-view" class="view active canvas-view" aria-label="{{ project.name }}节点画布">
    <div class="canvas-viewport" id="canvas-viewport" tabindex="0">
      <div class="canvas-world" id="canvas-world"><svg class="canvas-links" id="canvas-links" aria-hidden="true"></svg><div class="canvas-nodes" id="canvas-nodes"></div></div>
      <div class="canvas-empty-hint" id="empty-hint"><b>从一个想法或素材开始</b><span>上传图片，或在画布中创建生成请求</span></div>
      <div class="canvas-breadcrumb"><a href="/projects">项目</a><span>/</span><b>{{ project.name }}</b></div>
      <div class="canvas-toolbar" aria-label="创作工具">
        <label class="tool-button" title="上传参考图片"><input id="canvas-upload" type="file" accept="image/png,image/jpeg,image/webp" multiple><span aria-hidden="true">＋</span><small>素材</small></label>
        <button class="tool-button primary-tool" data-action="add-request" title="创建生成请求"><span aria-hidden="true">◇</span><small>生成</small></button>
        <button class="tool-button" data-action="add-note" title="创建备注"><span aria-hidden="true">T</span><small>备注</small></button>

        <button class="tool-button" data-action="delete-focused" title="仅从画布移除选中节点"><span aria-hidden="true">×</span><small>移除</small></button>
      </div>
      <div class="reference-mode-tip visible" id="reference-mode-tip">拖动“输出”端口到生成请求的“输入”端口，绑定参考图</div>
      <div class="zoom-control"><button data-action="zoom-out" aria-label="缩小">−</button><button data-action="zoom-reset" id="canvas-zoom">100%</button><button data-action="zoom-in" aria-label="放大">＋</button><button data-action="fit-view">适应</button></div>
      <canvas class="minimap" id="minimap" width="190" height="125" aria-label="画布小地图"></canvas>
    </div>
  </section>
  <section id="history-view" class="view history-view">
    <div class="history-header"><div><span class="eyebrow">IMMUTABLE HISTORY</span><h1>生成历史</h1><p>节点可移动或移除，任务证据与原图始终保留。</p></div><div class="filters"><input id="search-input" placeholder="搜索提示词"><select id="filter-provider"><option value="">全部平台</option><option value="libtv">LibTV</option><option value="lovart">Lovart</option><option value="api">API</option></select><select id="filter-sentiment"><option value="">全部标记</option><option value="satisfied">满意</option><option value="adopted">采用</option><option value="dissatisfied">不满意</option></select></div></div>
    <div id="history-grid" class="history-grid"></div>
  </section>
</main>
<div class="toast" id="toast" aria-live="polite"></div>
<dialog class="lightbox" id="lightbox" aria-label="全屏审图">
  <div class="lightbox-bar"><div><strong id="lightbox-title">生成结果</strong><span id="lightbox-counter"></span></div><div class="lightbox-tools"><button type="button" data-lightbox-action="zoom-out">−</button><button type="button" data-lightbox-action="reset" id="lightbox-zoom">100%</button><button type="button" data-lightbox-action="zoom-in">＋</button><a id="lightbox-download" href="#" download>原图下载</a><button type="button" data-lightbox-action="close">×</button></div></div>
  <div class="lightbox-stage" id="lightbox-stage"><button type="button" class="lightbox-nav" data-lightbox-action="previous" aria-label="上一张">‹</button><div class="lightbox-canvas"><img id="lightbox-image" alt="生成结果原图"></div><button type="button" class="lightbox-nav" data-lightbox-action="next" aria-label="下一张">›</button></div>
  <div class="lightbox-caption"><p id="lightbox-prompt"></p><span id="lightbox-meta"></span></div>
</dialog>
<script>window.IMAGE_HUB_MODELS = {{ profiles | tojson }}; window.IMAGE_HUB_CSRF = {{ csrf_token | tojson }}; window.IMAGE_HUB_PROJECT_ID = {{ project.id | tojson }};</script>
<script src="/static/app.js?v=canvas-v3" defer></script>
{% endblock %}
