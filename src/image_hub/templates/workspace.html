{% extends "base.html" %}
{% block title %}{{ project.name }} · AI Image Hub{% endblock %}
{% block body %}
<a class="skip-link" href="#canvas-viewport">跳到画布</a>
<header class="workspace-bar">
  <div class="workspace-left">
    <a class="icon-link" href="/projects" aria-label="返回项目" title="返回项目">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <form class="project-name-form" action="/projects/{{ project.id }}/rename" method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input name="name" value="{{ project.name }}" maxlength="160" aria-label="项目名称">
      <button class="quiet-button" type="submit">保存名称</button>
    </form>
  </div>
  <div class="workspace-actions">
    <span class="save-state" id="save-state" role="status"><i></i>已保存</span>
    <a href="/projects/{{ project.id }}/history">历史</a>
    {% if user.role == "admin" %}<a href="/admin">管理</a>{% endif %}
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="quiet-button">退出</button></form>
  </div>
</header>
<main class="canvas-shell" data-project-id="{{ project.id }}">
  <div class="canvas-toolbar" aria-label="画布工具">
    <label class="tool-button" title="上传图片"><input id="canvas-upload" type="file" accept="image/png,image/jpeg,image/webp" multiple><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 14v5h14v-5"/></svg><span>上传图片</span></label>
    <button class="tool-button primary-tool" id="add-request" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建生图</span></button>
    <span class="tool-divider"></span>
    <button class="tool-button icon-only" id="fit-view" type="button" aria-label="适应内容" title="适应内容"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg></button>
    <button class="tool-button icon-only" id="zoom-out" type="button" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6m2.2 5.2L21 21"/></svg></button>
    <button class="zoom-label" id="zoom-reset" type="button" aria-label="重置缩放" title="重置为 100%">100%</button>
    <button class="tool-button icon-only" id="zoom-in" type="button" aria-label="放大" title="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11h6m-3-3v6m5.2 2.2L21 21"/></svg></button>
  </div>
  <section class="canvas-viewport" id="canvas-viewport" tabindex="0" aria-label="项目创作画布">
    <div class="canvas-world" id="canvas-world">
      <svg class="canvas-links" id="canvas-links" width="5000" height="3600" aria-hidden="true"></svg>
      <div class="canvas-nodes" id="canvas-nodes"></div>
    </div>
    <div class="canvas-empty" id="canvas-empty">
      <strong>拖入图片，或新建生图</strong>
      <span>从图片右侧拉线，即可绑定到生图器</span>
      <button type="button" data-empty-action="request">直接新建生图</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
window.IMAGE_HUB_MODELS = {{ profiles | tojson }};
window.IMAGE_HUB_CSRF = {{ csrf_token | tojson }};
window.IMAGE_HUB_PROJECT_ID = {{ project.id | tojson }};
</script>
<script src="/static/canvas-core.js?v=1" defer></script>
<script src="/static/app.js?v=5" defer></script>
{% endblock %}
