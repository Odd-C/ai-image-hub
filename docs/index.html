<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
  <title>AI Image Hub V1 · 轻节点画布 Demo</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="demo.css?v=v3-final">
</head>
<body>
<header class="bar"><a class="back" href="#" aria-label="返回项目">‹</a><strong>虚构项目 · 春季产品视觉</strong><span class="saved"><i></i>已保存</span><nav><button id="history-button">历史</button><button id="role-button">普通用户</button><button id="admin-button" hidden>管理</button><button>退出</button></nav></header>
<main>
  <div class="tools"><label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" multiple><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 14v5h14v-5"/></svg><span>上传图片</span></label><button id="add-request" class="primary"><span>＋</span>新建生图</button><i></i><button id="fit" aria-label="适应内容">适应内容</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom">100%</button><button id="zoom-in" aria-label="放大">＋</button></div>
  <section id="viewport" class="viewport" tabindex="0" aria-label="虚构项目创作画布"><div id="world" class="world"><svg id="links" width="5000" height="3600" aria-hidden="true"></svg><div id="nodes"></div></div><div id="empty" class="empty"><strong>拖入图片，或新建生图</strong><span>从图片右侧拉线，即可绑定到生图器</span><button id="empty-request">直接新建生图</button></div></section>
</main>
<section class="history" id="history" hidden><header><div><small>HISTORY</small><h1>生成历史</h1><p>虚构演示记录，不调用任何真实 API。</p></div><button id="close-history">返回画布</button></header><div class="filters"><input id="search" placeholder="搜索提示词"><select><option>全部状态</option><option>已完成</option></select><select><option>全部平台与模型</option><option>API · Seedream Studio</option></select><select><option>全部评价</option><option>采用</option><option>满意</option><option>不满意</option></select></div><div id="history-grid" class="history-grid"></div></section>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="demo.js?v=v3-final"></script>
</body></html>
