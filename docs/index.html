<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>AI Image Hub V1 · 轻节点画布 Demo</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="demo.css?v=refinement-3"></head>
<body>
<header class="bar"><div class="bar-context"><button id="projects-button" aria-controls="project-sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>项目</span></button><span id="project-name">春季产品视觉</span></div><span class="saved"><i></i>本地已保存</span><nav><button id="history-button">历史</button><button id="role-button">普通用户</button><button id="admin-button" hidden>管理</button><button>退出</button></nav></header>
<div class="workspace" id="workspace"><div id="project-scrim" class="project-scrim" hidden></div><aside id="project-sidebar" class="project-sidebar" aria-label="项目"><header><b>项目</b><div><button data-new aria-label="新建项目" title="新建项目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="sidebar-collapse" aria-label="收起项目侧栏" title="收起项目侧栏" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button></div></header><nav id="project-list" aria-label="项目列表"></nav><footer><button id="all-projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8"/></svg><span>所有项目</span></button><button data-new><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建项目</span></button></footer></aside><main><div class="tools"><label title="上传图片"><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" multiple><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 14v5h14v-5"/></svg><span>上传图片</span></label><button id="add-request" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建生图</span></button><i></i><button id="fit" class="icon" aria-label="适应内容"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg></button><button id="zoom-out" class="icon" aria-label="缩小">−</button><button id="zoom" aria-label="重置缩放">100%</button><button id="zoom-in" class="icon" aria-label="放大">＋</button></div><section id="viewport" class="viewport" tabindex="0" aria-label="虚构项目创作画布"><div id="world" class="world"><svg id="links" width="5000" height="3600" aria-hidden="true"></svg><div id="nodes"></div></div><div id="empty" class="empty"><strong>拖入图片，或新建生图</strong><span>右键画布可快速操作</span><button id="empty-request">直接新建生图</button></div></section><aside id="minimap" class="minimap" aria-label="画布缩略导航"><button id="minimap-toggle" aria-expanded="true">导航</button><svg id="minimap-map" viewBox="0 0 176 112" aria-label="节点与可见区域"></svg></aside></main></div>
<section class="history" id="history" hidden><header><div><small>HISTORY</small><h1>生成历史</h1><p>虚构同源演示记录，真实付费调用为 0。</p></div><button id="close-history">返回画布</button></header><div id="history-grid" class="history-grid"></div></section>
<div id="context-menu" class="context-menu" role="menu" hidden></div><div id="shortcuts" class="shortcuts" role="dialog" aria-label="画布快捷键" hidden><header><b>快捷键</b><button data-close>×</button></header><p>点击 / Shift+点击：选择 · 多选</p><p>Ctrl/Cmd+C / V：复制 · 粘贴</p><p>Ctrl/Cmd+A / Delete：全选 · 移除</p><p>0 / + / −：适应 · 缩放</p><p>? / Escape：帮助 · 取消</p></div>
<dialog id="new-project"><form method="dialog"><header><b>新建项目</b><button value="cancel">×</button></header><label>项目名称<input id="new-project-name" required maxlength="80" placeholder="例如：夏季产品视觉"></label><footer><button value="cancel">取消</button><button id="create-project" value="default">创建并打开</button></footer></form></dialog>
<dialog id="viewer" aria-labelledby="viewer-title"><header><b id="viewer-title">查看大图</b><div class="viewer-controls"><div class="viewer-zoom-controls" aria-label="缩放控制"><button id="viewer-zoom-out" aria-label="缩小图片" title="缩小图片（-）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><output id="viewer-zoom" aria-label="当前缩放比例">100%</output><button id="viewer-zoom-in" aria-label="放大图片" title="放大图片（+）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="viewer-fit" aria-label="适应窗口" title="适应窗口（0）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/></svg></button><button id="viewer-actual" aria-label="按原始尺寸显示" title="100% 原始尺寸（1）">100%</button></div><div class="viewer-file-controls"><a id="viewer-original" target="_blank" rel="noopener" aria-label="打开原图" title="打开原图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8"/><path d="M17 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5"/></svg><span>打开原图</span></a><a id="viewer-download" download aria-label="下载原图" title="下载原图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 19h14"/></svg><span>下载</span></a><button id="viewer-close" aria-label="关闭查看器" title="关闭查看器"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div></header><div class="viewer-stage"><img alt="完整大图预览" draggable="false"></div></dialog><div id="toast" class="toast" aria-live="polite"></div>
<script src="demo.js?v=refinement-3"></script></body></html>
